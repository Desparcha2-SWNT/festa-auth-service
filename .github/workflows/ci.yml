# CI de festa-auth-service (SCRUM-44).
# 1) Escaneo de secretos y vulnerabilidades: workflow reutilizable de la organización.
# 2) Análisis estático del código con CodeQL (Java).
# 3) Linter (Checkstyle) y pruebas (JUnit) con Maven; los resultados quedan visibles en el PR.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    uses: Desparcha2-SWNT/.github/.github/workflows/ci-reusable.yml@main
    # El workflow llamado no puede pedir más permisos que este job. Su job de CodeQL declara
    # security-events: write y GitHub lo valida al arrancar aunque CodeQL esté desactivado.
    permissions:
      contents: read
      security-events: write
    with:
      # Este repo compila y prueba en su propio job; el build del CI reutilizable se omite (no queda en verde, queda "skipped").
      stack: none
      # Análisis estático del código propio (SAST). Gratis porque el repositorio es público.
      enable-codeql: true
      codeql-language: java-kotlin

  java:
    name: Linter, build y pruebas (Java 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Contratos de mensajería (festa-infra es público, no hace falta token) para ContractTest.
      - name: Descargar contratos de festa-infra
        uses: actions/checkout@v4
        with:
          repository: Desparcha2-SWNT/festa-infra
          ref: develop
          path: .festa-infra
          sparse-checkout: contracts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Linter, build y pruebas
        run: mvn -B verify -Dfesta.contracts.dir="$GITHUB_WORKSPACE/.festa-infra/contracts"

      - name: Resumen de cobertura (JaCoCo)
        if: always() && hashFiles('target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9; mm += $12; mc += $13 }
            function pct(c, m) { return (c + m) ? sprintf("%.2f %%", 100 * c / (c + m)) : "sin datos" }
            END {
              print "## Cobertura de pruebas (JaCoCo)\n"
              print "| Métrica | Cobertura | Cubiertas |"
              print "|---|---|---|"
              printf "| Líneas | %s | %d de %d |\n", pct(lc, lm), lc, lc + lm
              printf "| Instrucciones | %s | %d de %d |\n", pct(ic, im), ic, ic + im
              printf "| Métodos | %s | %d de %d |\n", pct(mc, mm), mc, mc + mm
              printf "| Ramas | %s | %d de %d |\n", pct(bc, bm), bc, bc + bm
            }' target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"

      # Análisis de SonarCloud desde el CI, con la cobertura de JaCoCo (target/site/jacoco/jacoco.xml).
      # Requiere SONAR_TOKEN (secreto de la organización) y el análisis automático apagado en el proyecto.
      - name: Análisis de SonarCloud
        if: always() && hashFiles('target/site/jacoco/jacoco.xml') != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=desparcha2-swnt
          -Dsonar.projectKey=Desparcha2-SWNT_festa-auth-service
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Publicar resultados de pruebas en el PR
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          check_name: Pruebas JUnit
          detailed_summary: true
          include_passed: true
